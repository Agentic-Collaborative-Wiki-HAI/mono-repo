name: Move reopened issue back to Backlog

on:
  issues:
    types:
      - reopened

env:
  GH_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  STATUS_FIELD_ID: ${{ vars.STATUS_FIELD_ID }}
  BACKLOG_OPTION_ID: ${{ vars.BACKLOG_OPTION_ID }}

jobs:
  move-to-backlog:
    runs-on: ubuntu-latest
    steps:
      - name: Move to Backlog
        run: |
          ISSUE_NODE_ID="${{ github.event.issue.node_id }}"

          ITEM_ID=$(gh api graphql --paginate -f query='
            query($project: ID!, $endCursor: String) {
              node(id: $project) {
                ... on ProjectV2 {
                  items(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes { id content { ... on Issue { id } } }
                  }
                }
              }
            }' -f project="$PROJECT_ID" \
            --jq ".data.node.items.nodes[] | select(.content.id == \"$ISSUE_NODE_ID\") | .id" | head -1)

          if [ -z "$ITEM_ID" ]; then
            echo "Issue not on the board — nothing to update."
            exit 0
          fi

          CURRENT=$(gh api graphql -f query='
            query($item: ID!) {
              node(id: $item) {
                ... on ProjectV2Item {
                  fieldValueByName(name: "Status") {
                    ... on ProjectV2ItemFieldSingleSelectValue { optionId }
                  }
                }
              }
            }' -f item="$ITEM_ID" --jq '.data.node.fieldValueByName.optionId // ""')

          if [ "$CURRENT" == "$BACKLOG_OPTION_ID" ]; then
            echo "Already in Backlog — skipping."
            exit 0
          fi

          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item, fieldId: $field,
                value: { singleSelectOptionId: $option }
              }) { projectV2Item { id } }
            }' \
            -f project="$PROJECT_ID" -f item="$ITEM_ID" \
            -f field="$STATUS_FIELD_ID" -f option="$BACKLOG_OPTION_ID"

          echo "Done."
