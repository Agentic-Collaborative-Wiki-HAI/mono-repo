name: Sync blocked label to board status

on:
  issues:
    types:
      - labeled
      - unlabeled

env:
  GH_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  STATUS_FIELD_ID: ${{ vars.STATUS_FIELD_ID }}
  BLOCKED_OPTION_ID: ${{ vars.BLOCKED_OPTION_ID }}
  ON_DECK_OPTION_ID: ${{ vars.ON_DECK_OPTION_ID }}

jobs:
  sync:
    # Only fires for the `blocked` label. Every other label change is ignored,
    # so this cannot clobber a manual board move the way a general `labeled`
    # trigger would.
    if: github.event.label.name == 'blocked'
    runs-on: ubuntu-latest
    steps:
      - name: Move item based on blocked label
        run: |
          ISSUE_NODE_ID="${{ github.event.issue.node_id }}"

          if [ "${{ github.event.action }}" == "labeled" ]; then
            TARGET="$BLOCKED_OPTION_ID"; TARGET_NAME="Blocked"
          else
            # Unblocking sends it to On Deck rather than guessing where it was.
            # If that is wrong for a given issue, move it by hand.
            TARGET="$ON_DECK_OPTION_ID"; TARGET_NAME="On Deck"
          fi

          ITEM_ID=$(gh api graphql --paginate -f query='
            query($project: ID!, $endCursor: String) {
              node(id: $project) {
                ... on ProjectV2 {
                  items(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes { id content { ... on Issue { id } } }
                  }
                }
              }
            }' -f project="$PROJECT_ID" \
            --jq ".data.node.items.nodes[] | select(.content.id == \"$ISSUE_NODE_ID\") | .id" | head -1)

          if [ -z "$ITEM_ID" ]; then
            echo "Issue not on the board — nothing to update."
            exit 0
          fi

          echo "Setting status to '$TARGET_NAME'..."
          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item, fieldId: $field,
                value: { singleSelectOptionId: $option }
              }) { projectV2Item { id } }
            }' \
            -f project="$PROJECT_ID" -f item="$ITEM_ID" \
            -f field="$STATUS_FIELD_ID" -f option="$TARGET"
